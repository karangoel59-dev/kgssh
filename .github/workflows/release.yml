name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_name: kgssh-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            asset_name: kgssh-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset_name: kgssh-darwin-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset_name: kgssh-darwin-amd64

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o dist/${{ matrix.asset_name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            dist/kgssh-linux-amd64/kgssh-linux-amd64
            dist/kgssh-linux-arm64/kgssh-linux-arm64
            dist/kgssh-darwin-amd64/kgssh-darwin-amd64
            dist/kgssh-darwin-arm64/kgssh-darwin-arm64
